version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://medvision:password@db:5432/medvision
      - JWT_SECRET=yoursecretkey
      - MODEL_PATH=/app/model/dr_efficientnet_b0.pth
      - FRONTEND_URL=http://localhost:5173
    volumes:
      - ./model:/app/model
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=medvision
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=medvision
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medvision -d medvision"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
